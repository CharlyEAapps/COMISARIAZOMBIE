<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turno de Noche · Previsualización de armas</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b1e24; overflow: hidden; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #bar { position: fixed; top: 8px; left: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 80vw; z-index: 5; }
    #bar button, #bar label { background: rgba(20, 24, 32, .82); color: #e8ecf2; border: 1px solid #3a4150; border-radius: 4px; padding: 2px 7px; font-size: 11px; cursor: pointer; }
    #bar button.on { background: #2f5fa8; }
    #stats { position: fixed; bottom: 8px; left: 8px; color: #dfe6ee; font: 11px/1.35 monospace; background: rgba(20,24,32,.8); padding: 6px 10px; border-radius: 4px; z-index: 5; white-space: pre; }
    #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    #labels div { position: absolute; transform: translate(-50%, -100%); color: #fff; font: 11px monospace; background: rgba(20,24,32,.75); padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <div id="bar"></div>
  <div id="stats"></div>
  <script type="module" src="/src/render/weapons-preview.js"></script>
</body>
</html>
